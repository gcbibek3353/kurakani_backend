name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/gcbibek3353/kurakani-backend:latest
          # Without this every run reinstalls ~1000 pnpm packages from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The VPS needs the compose file to run `pull`/`up`, but nothing else
      # from the repo — no source, no node_modules. .env lives on the VPS by
      # hand so secrets never pass through Actions.
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: |
            docker-compose.yml
            Caddyfile
          target: ~/kurakani-backend

      - uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            cd ~/kurakani-backend
            # Run-scoped token: valid only while this job is running, so no
            # long-lived registry credential is left on the box.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull backend
            docker compose up -d
            docker logout ghcr.io
            docker image prune -f
