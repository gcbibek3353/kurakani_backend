name: kurakani-backend

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 10
    networks: [kurakani]

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    networks: [kurakani]

  backend:
    image: ghcr.io/gcbibek3353/kurakani-backend:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: http://minio:9000
    # No host port: all public traffic arrives via Caddy over TLS. Exposing
    # 3001 in parallel would let clients reach the API over plain HTTP, where
    # Better Auth's `secure` cookies are silently dropped.
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [kurakani]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"     # required for the ACME HTTP-01 challenge, not just redirects
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates — losing this re-issues and can hit rate limits
      - caddy_config:/config
    networks: [kurakani]

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  kurakani:
    external: true
